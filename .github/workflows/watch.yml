name: watch

on:
  schedule:
    # Le cron GitHub est fortement throttlé (constaté : 1 déclenchement / 1-3 h).
    # Il sert uniquement de relais : chaque job boucle ~5h30 en vérifiant toutes
    # les ~5 min, et le groupe de concurrence met le run suivant en file
    # d'attente → il démarre dès la fin du job courant, sans chevauchement.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Boucle de surveillance (~5h30, un check toutes les ~5 min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESA_PHONE: ${{ secrets.RESA_PHONE }}
          RESA_FIRSTNAME: ${{ secrets.RESA_FIRSTNAME }}
          RESA_LASTNAME: ${{ secrets.RESA_LASTNAME }}
          RESA_EMAIL: ${{ secrets.RESA_EMAIL }}
          RESA_CIVILITY: ${{ secrets.RESA_CIVILITY }}
        run: |
          START=$(date +%s)
          while [ $(( $(date +%s) - START )) -lt 19800 ]; do
            python3 bot.py || true
            if [ -f state.json ] && grep -q '"status": "done"' state.json; then
              echo "Tous les objectifs finalisés — sortie de boucle."
              break
            fi
            sleep 240
          done

      - name: Persister l'état
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "table-watcher"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "état: mise à jour après run"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
